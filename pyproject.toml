[project]
name = "polars-list-utils"
authors = [{ name="Travis Hammond", email="dashdeckers@gmail.com" }]
description = "Signal-processing utilities for List columns in Polars"
readme = "README.md"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]
requires-python = ">= 3.10"
keywords = ["polars", "polars-plugin", "signal-processing", "dsp", "fft"]
dependencies = [
    "polars >= 1.23.0",
]

[project.urls]
Repository = "https://github.com/dashdeckers/polars_list_utils"

[project.optional-dependencies]
dev = [
    "maturin >= 1.0, < 2.0",
    "pytest >= 8.0",
    "numpy >= 2.2.3",
    "matplotlib >= 3.4.0",
]

[build-system]
build-backend = "maturin"
requires = [
    "maturin >= 1.0, < 2.0",
]

[tool.maturin]
module-name = "polars_list_utils._internal"
