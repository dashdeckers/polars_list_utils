[package]
name = "polars-list-utils"
version = "1.0.0"
edition = "2024"

[lib]
name = "polars_list_utils"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.26", features = ["extension-module", "abi3-py310"] }
pyo3-polars = { version = "0.25", features = ["derive"] }
polars = { version = "0.52", default-features = false }
serde = { version = "1", features = ["derive"] }
realfft = "3.4.0"
butterworth = "0.1.0"
interp = "2.0.2"
